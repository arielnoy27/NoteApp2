<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f6fb" />
    <meta name="description" content="A calm, full-screen notes and to-do app." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Papertrail" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Papertrail Notes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="connection-banner" class="connection-banner hidden" role="status"></div>
    <div id="update-banner" class="update-banner hidden" role="status"><span>A new version is ready.</span><button id="apply-update" type="button">Update</button></div>
    <main id="app" class="app-shell">
      <section id="home-view" class="home-view" aria-label="Notes home">
        <header class="home-header">
          <div>
            <p id="today-label" class="eyebrow"></p>
            <h1><span id="greeting-label">Good morning,</span> <em id="user-name-label">Alex.</em></h1>
          </div>
          <div class="header-actions"><button id="new-note" class="quick-add" aria-label="Create a new note">＋</button><button id="theme-toggle" class="theme-toggle" aria-label="Switch to dark mode">☾</button><button class="avatar" aria-label="Open profile">A</button></div>
        </header>
        <div class="search-row">
          <label class="search-box"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Search your notes" /></label>
          <button class="filter-button" aria-label="Filter notes">≡</button>
        </div>
        <div class="section-heading"><h2>Your notes</h2><span id="note-count">4 notes</span></div>
        <div class="filter-strip" aria-label="Note filters"><button class="filter-chip active" data-filter="all">All</button><button class="filter-chip" data-filter="pinned">Pinned</button><button class="filter-chip" data-filter="todo">Tasks</button><button class="filter-chip" data-filter="archived">Archived</button><button class="filter-chip" data-filter="trash">Trash</button></div>
        <label class="folder-filter">Folder <select id="folder-filter"><option value="">All folders</option></select></label>
        <div id="notes-list" class="notes-list"></div>
        <nav class="bottom-nav" aria-label="Primary navigation">
          <button id="nav-notes" class="nav-item active"><span>▤</span>Notes</button><button id="nav-tasks" class="nav-item"><span>□</span>Tasks</button><button id="nav-settings" class="nav-item"><span>◌</span>Settings</button>
        </nav>
      </section>

      <section id="editor-view" class="editor-view hidden" aria-label="Full-screen note editor">
        <header class="editor-topbar">
          <button id="back-button" class="icon-button" aria-label="Back to notes">‹</button>
          <input id="title-input" class="title-input" value="Sunday reset" aria-label="Note title" />
          <div class="editor-actions">
            <button id="pin-button" class="icon-button" aria-label="Pin note">⌖</button>
            <button id="favorite-button" class="icon-button" aria-label="Favorite note">♡</button>
            <button id="more-button" class="icon-button" aria-label="More actions">•••</button>
          </div>
        </header>
        <div id="more-menu" class="more-menu hidden"><button id="duplicate-button">Duplicate note</button><button id="archive-button">Archive note</button><button id="restore-button">Restore note</button><button id="delete-button" class="danger">Move to trash</button></div>
        <div id="writing-canvas" class="writing-canvas" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true"></div>
        <div id="checklist-canvas" class="checklist-canvas hidden"></div>
        <canvas id="drawing-canvas" class="drawing-canvas hidden"></canvas>
        <div id="drawing-tools" class="drawing-tools hidden" aria-label="Drawing tools"><label class="draw-color" aria-label="Pen color"><input id="draw-color" type="color" value="#438ee8" /></label><label class="draw-size">Size<input id="draw-size" type="range" min="1" max="18" value="4" /></label><button id="draw-eraser" type="button">Eraser</button><button id="draw-undo" type="button" aria-label="Undo drawing">↶</button><button id="draw-redo" type="button" aria-label="Redo drawing">↷</button><button id="draw-clear" type="button">Clear</button><button id="draw-exit" type="button">Done</button></div>
        <div id="save-status" class="save-status">Saved locally</div>
        <footer id="format-bar" class="format-bar">
          <button id="mode-button" class="tool-button" aria-label="Change note mode">Aa</button>
          <button id="bold-button" class="tool-button" aria-label="Bold"><strong>B</strong></button>
          <button id="bullet-button" class="tool-button" aria-label="Bullet list">☷</button>
          <button id="color-button" class="tool-button color-button" aria-label="Choose note color"><span class="current-color"></span></button>
          <span class="tool-divider"></span>
          <button id="direction-button" class="tool-button" aria-label="Writing direction">↔</button>
          <button id="done-button" class="done-button">Done</button>
        </footer>
        <div id="mode-menu" class="mode-menu hidden"><button data-mode="plain">Plain text</button><button data-mode="todo">To-do list</button><button data-mode="draw">Drawing</button></div>
        <div id="color-menu" class="color-menu hidden" aria-label="Text colors"><button data-color="adaptive" aria-label="Black text in light mode, white text in dark mode"><span></span></button><button data-color="blue" aria-label="Blue text"><span></span></button><button data-color="green" aria-label="Green text"><span></span></button><button data-color="yellow" aria-label="Yellow text"><span></span></button><button data-color="red" aria-label="Red text"><span></span></button><button data-color="purple" aria-label="Purple text"><span></span></button></div>
      </section>
    </main>
    <dialog id="organize-dialog"><form id="organize-form"><h2>Organize note</h2><label>Folder<input id="note-folder" list="folder-options" maxlength="60" placeholder="e.g. Personal" /></label><datalist id="folder-options"></datalist><label>Tags<input id="note-tags" maxlength="300" placeholder="ideas, home, reading" /></label><p>Separate tags with commas. Leave the folder empty for Unfiled.</p><div class="dialog-actions"><button type="button" id="organize-cancel">Cancel</button><button type="submit">Save</button></div></form></dialog>
    <dialog id="settings-dialog"><form id="settings-form"><h2>Settings</h2><label>Your name<input id="setting-name" maxlength="30" autocomplete="name" /></label><label>Theme<select id="setting-theme"><option value="light">Light</option><option value="dark">Dark</option><option value="system">Use device setting</option></select></label><label>Writing size<select id="setting-font-size"><option value="small">Small</option><option value="medium">Comfortable</option><option value="large">Large</option></select></label><label>Line spacing<select id="setting-line-spacing"><option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="roomy">Roomy</option></select></label><section class="pwa-settings"><h3>App</h3><p>Install Papertrail for quicker access and offline use.</p><button type="button" id="install-app" hidden>Install app</button><output id="install-status" aria-live="polite"></output></section><section class="backup-settings"><h3>Backup</h3><p>Download all notes or merge notes from an earlier backup.</p><div><button type="button" id="export-backup">Export backup</button><button type="button" id="import-backup">Import backup</button><input id="backup-file" type="file" accept="application/json,.json" hidden /></div><output id="backup-status" aria-live="polite"></output></section><div class="dialog-actions"><button type="button" id="settings-cancel">Cancel</button><button type="submit">Save settings</button></div></form></dialog>
    <script src="app.js"></script>
    <script src="organization.js"></script>
    <script src="checklist.js"></script>
    <script src="colors.js"></script>
    <script src="editor-tools.js"></script>
    <script src="drawing.js"></script>
    <script src="settings.js"></script>
    <script src="backup.js"></script>
    <script src="pwa-experience.js"></script>
  </body>
</html>
